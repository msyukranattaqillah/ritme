<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light dark}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head><body>
<title>Ritme Maba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..700&display=swap">
<style>
/* Konsep: rail kiri di laptop, tab bawah di HP. Inti halaman = tiga meter (Waktu, Uang, Tenaga) yang tiap hari terisi dan berkurang. */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#DCE2ED;
  --fg:#0F1830; --muted:#566079; --faint:#8590A6;
  --waktu:#3F5CF2; --waktu-ink:#2D45CE;
  --uang:#0A8157; --uang-ink:#07694A;
  --tenaga:#F2A01E; --tenaga-ink:#8F5200;
  --danger:#CC2F49;
  --on-ink:#FFFFFF; --on-waktu:#FFFFFF; --on-uang:#FFFFFF; --on-tenaga:#1B1100;
  --shadow:0 1px 2px rgba(15,24,48,.05),0 12px 28px -16px rgba(15,24,48,.22);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B101C; --surface:#131A2A; --surface-2:#192238; --line:#25304A;
    --fg:#E9EDF6; --muted:#9AA6BD; --faint:#6F7C96;
    --waktu:#8EA2FF; --waktu-ink:#A9B8FF;
    --uang:#3DD6A0; --uang-ink:#5BE3B3;
    --tenaga:#F6B44F; --tenaga-ink:#F8C47A;
    --danger:#FF7088;
    --on-ink:#0B101C; --on-waktu:#0B101C; --on-uang:#05150E; --on-tenaga:#1B1100;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101C; --surface:#131A2A; --surface-2:#192238; --line:#25304A;
  --fg:#E9EDF6; --muted:#9AA6BD; --faint:#6F7C96;
  --waktu:#8EA2FF; --waktu-ink:#A9B8FF;
  --uang:#3DD6A0; --uang-ink:#5BE3B3;
  --tenaga:#F6B44F; --tenaga-ink:#F8C47A;
  --danger:#FF7088;
  --on-ink:#0B101C; --on-waktu:#0B101C; --on-uang:#05150E; --on-tenaga:#1B1100;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.55 var(--body); -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 0;
  --accent:var(--fg); --on-accent:var(--on-ink);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* kerangka */
.app{position:relative;max-width:1180px;margin:0 auto;padding-bottom:96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:-.02em}
.mark{width:30px;height:30px;flex:none}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.chip-sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.chip-sync.ok i{background:var(--uang)} .chip-sync.warn i{background:var(--tenaga)} .chip-sync.bad i{background:var(--danger)}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:14px;padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav-item svg{width:22px;height:22px}
.nav-item[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav-item[aria-current="page"] svg{color:var(--c,var(--fg))}

.main{--accent:var(--fg);--on-accent:var(--on-ink);min-width:0}
.main[data-tone="waktu"]{--accent:var(--waktu);--on-accent:var(--on-waktu);--ink:var(--waktu-ink)}
.main[data-tone="uang"]{--accent:var(--uang);--on-accent:var(--on-uang);--ink:var(--uang-ink)}
.main[data-tone="tenaga"]{--accent:var(--tenaga);--on-accent:var(--on-tenaga);--ink:var(--tenaga-ink)}

@media (min-width:900px){
  body{padding-block:28px 40px}
  .app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:44px;padding-bottom:0}
  .top{grid-column:2;grid-row:1;padding-top:0}
  .main{grid-column:2;grid-row:2}
  .nav{position:sticky;top:28px;grid-column:1;grid-row:1/3;align-self:start;flex-direction:column;gap:6px;padding:0;background:none;backdrop-filter:none;border:0}
  .nav-item{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px;border-radius:14px}
  .nav-item[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
  .brand{position:absolute;left:0;top:0}
  .nav{margin-top:56px}
}
@media (min-width:900px){ .top{min-height:36px} }

/* tipografi */
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5.2vw,42px)/1.08 var(--display);letter-spacing:-.025em;text-wrap:balance}
h2{font:700 19px/1.25 var(--display);letter-spacing:-.01em}
h3{font-size:14px;font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.pagehead h1{margin-top:6px}
.hero{margin-bottom:22px}
.hero h1{margin:6px 0 8px}

/* panel dan meter */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.panel>h2{margin-bottom:4px}
.panel>.sub{margin-bottom:14px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.stack{display:grid;gap:16px}
.meters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));margin-bottom:16px}
.meter{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.meter .body{min-width:0;flex:1}
.meter h3{color:var(--ci);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase}
.meter .big{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:3px 0 2px;overflow-wrap:anywhere}
.meter .big.bad{color:var(--danger)}
.meter .sub{font-size:13px}
.ring{width:64px;height:64px;flex:none}
.ring .trk{fill:none;stroke:var(--line);stroke-width:7}
.ring .val{fill:none;stroke:var(--c);stroke-width:7;stroke-linecap:round}
.ring.over .val{stroke:var(--danger)}
.linkbtn{border:0;background:none;padding:0;font-weight:700;color:var(--ci,var(--ink,var(--fg)));text-decoration:underline;text-underline-offset:3px}

/* daftar */
.rows>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.is-done .t{color:var(--faint);text-decoration:line-through}
.tag{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-weight:600}
.due.hot{color:var(--tenaga-ink);font-weight:700} .due.bad{color:var(--danger);font-weight:700}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:transparent}
.check svg{width:14px;height:14px}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icon-btn{border:1px solid transparent;background:none;border-radius:10px;min-width:36px;height:36px;padding:0 8px;display:grid;place-items:center;color:var(--faint);font-size:12.5px;font-weight:700;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.on{color:var(--tenaga-ink)} .icon-btn.on svg{fill:currentColor}
.icon-btn.danger{color:var(--danger);border-color:var(--danger)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);font-size:14px}
.day{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}
.day.now{color:var(--ink,var(--fg))}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:var(--ci,var(--fg))}

/* form */
form{display:grid;gap:12px}
.field{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;min-height:46px}
textarea.field{resize:vertical;min-height:72px}
.field::placeholder{color:var(--faint)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.inline{display:flex;gap:10px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:11px 18px;min-height:46px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:none;border-radius:11px;padding:8px 16px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.moneyin{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.moneyin span{font:700 20px var(--display);color:var(--muted)}
.moneyin input{border:0;background:none;font:700 30px/1.2 var(--display);width:100%;min-width:0;padding:6px 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.moneyin input:focus-visible{outline:0}
.moneyin:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:48px;font:700 18px var(--display)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.scalecap{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font:700 22px/1 var(--display)}
.stepper output{font:700 28px var(--display);min-width:104px;text-align:center;font-variant-numeric:tabular-nums}

/* uang */
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));width:var(--w,0%)}
.bar>b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);border-radius:2px;left:var(--p,0%)}
.bar.over>i{background:var(--danger)}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-top:18px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.stat .v{font:700 20px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .k{font-size:12.5px;color:var(--muted)}
.split{display:grid;gap:14px}
.split .head{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:6px}
.split .head b{font-weight:700}
.amt{font:700 15px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}

/* tenaga dan rekap */
.chart{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--body);fill:var(--faint)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.chart .bar-r{fill:var(--c)}
.chart .ghost{fill:var(--line)}
.chart .today{fill:var(--fg)}
.insight{background:color-mix(in srgb,var(--tenaga) 14%,var(--surface));border-radius:14px;padding:14px 16px;font-size:14.5px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi .v{font:700 28px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.kpi .k{font-size:12.5px;font-weight:700;color:var(--ci);letter-spacing:.06em;text-transform:uppercase}
.mini{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:6px}
.mini div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--muted);font-weight:600}
.mini i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--waktu);min-height:4px}
.mini i.zero{background:var(--line)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav b{font-size:14px;min-width:130px;text-align:center}
.quote{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}

/* timer */
.timer{display:grid;justify-items:center;gap:14px;text-align:center}
.tring{position:relative;width:176px;height:176px}
.tring svg{width:100%;height:100%}
.tring .trk{fill:none;stroke:var(--line);stroke-width:9}
.tring .val{fill:none;stroke:var(--waktu);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.tring.rest .val{stroke:var(--uang)}
.tring .in{position:absolute;inset:0;display:grid;place-content:center}
.tring .num{font-size:40px;font-weight:700;line-height:1}
.tring p+p{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}

/* onboarding */
.welcome{background:linear-gradient(135deg,color-mix(in srgb,var(--waktu) 14%,var(--surface)),color-mix(in srgb,var(--uang) 12%,var(--surface)) 60%,color-mix(in srgb,var(--tenaga) 14%,var(--surface)));border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px}
.welcome ol{margin:14px 0 18px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.welcome li{display:flex;gap:12px;align-items:center;counter-increment:s}
.welcome li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--on-ink);display:grid;place-items:center;font:700 14px var(--display);flex:none}
.skel{height:92px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* sheet dan toast */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(8,12,24,.52);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(540px,100%);max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
@media (min-width:900px){.sheet-back{align-items:center}.sheet{border-radius:26px}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;background:var(--fg);color:var(--on-ink);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="6" rx="3" fill="var(--waktu)"/><rect x="3" y="13" width="19" height="6" rx="3" fill="var(--uang)"/><rect x="3" y="21" width="23" height="6" rx="3" fill="var(--tenaga)"/></svg>
      <span>Ritme</span>
    </div>
    <div class="top-r">
      <span class="chip-sync" id="sync" title=""><i></i><span>Menyambung…</span></span>
      <button class="round" data-act="opensheet" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Menu utama"></nav>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- util ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseKey=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var weekStart=function(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
var rp=function(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Math.round(n||0))};
var f1=function(n){return String(Math.round(n*10)/10).replace('.',',')};

function byPrefix(p){var o=[];S.docs.forEach(function(v,k){if(k.indexOf(p)===0){var c=Object.assign({},v);c.id=k;o.push(c)}});return o}
function cfg(){return Object.assign({budget:0,savePct:20,sleepTarget:7},S.docs.get('cfg')||{})}
function saveLocal(){try{localStorage.setItem('ritme.docs',JSON.stringify(Array.from(S.docs.entries())))}catch(e){}}
function enqueue(id,fn){
  var prev=Q.get(id)||Promise.resolve();
  var p=prev.then(fn).catch(function(){toast('Belum bisa menyimpan. Coba lagi sebentar.')});
  Q.set(id,p);return p;
}
function put(id,data,silent){
  data=clean(data);S.docs.set(id,data);
  if(S.mode==='cloud')enqueue(id,function(){return S.col.doc(id).set(data)});else saveLocal();
  if(!silent)render();
}
function del(id,silent){
  S.docs.delete(id);
  if(S.mode==='cloud')enqueue(id,function(){return S.col.doc(id).delete()});else saveLocal();
  if(!silent)render();
}

/* ---------- hitungan ---------- */
function money(now){
  var c=cfg(),tk=dkey(now),ym=tk.slice(0,7);
  var days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dayN=now.getDate(),daysLeft=days-dayN+1;
  var ex=byPrefix('e_').filter(function(e){return e.date&&e.date.indexOf(ym)===0});
  var spent=ex.reduce(function(s,e){return s+e.amount},0);
  var today=ex.filter(function(e){return e.date===tk}).reduce(function(s,e){return s+e.amount},0);
  var usable=c.budget*(1-c.savePct/100);
  var perDay=c.budget>0?Math.max(0,(usable-(spent-today))/daysLeft):0;
  var by={kebutuhan:0,keinginan:0};
  ex.forEach(function(e){var k=CAT[e.cat];by[k?k.g:'keinginan']+=e.amount});
  return {set:c.budget>0,usable:usable,saving:c.budget-usable,spent:spent,today:today,left:usable-spent,perDay:perDay,by:by,days:days,dayN:dayN,daysLeft:daysLeft};
}
function dueInfo(due){
  if(!due)return {t:'Tanpa tenggat',cls:''};
  var diff=Math.round((parseKey(due)-parseKey(dkey()))/864e5);
  if(diff<0)return {t:'Terlambat '+(-diff)+' hari',cls:'bad'};
  if(diff===0)return {t:'Hari ini',cls:'hot'};
  if(diff===1)return {t:'Besok',cls:'hot'};
  if(diff<=3)return {t:diff+' hari lagi',cls:'hot'};
  return {t:fmtShort(parseKey(due)),cls:''};
}
function ring(p,extra){
  var C=169.65;p=Math.max(0,Math.min(1,p||0));
  return '<svg class="ring '+(extra||'')+'" viewBox="0 0 64 64" aria-hidden="true"><circle class="trk" cx="32" cy="32" r="27"/>'+
    (p>0?'<circle class="val" cx="32" cy="32" r="27" stroke-dasharray="'+(C*p).toFixed(2)+' '+C+'" transform="rotate(-90 32 32)"/>':'')+'</svg>';
}
function delBtn(id,label){
  var on=ui.confirm===id;
  return '<button class="icon-btn'+(on?' danger':'')+'" data-act="del" data-id="'+esc(id)+'" aria-label="Hapus '+esc(label)+'">'+(on?'Hapus?':IC.x)+'</button>';
}

    '<div class="grow"><p class="t">'+esc(t.title)+'</p><p class="m">'+(t.course?'<span class="tag">'+esc(t.course)+'</span>':'')+'<span class="due '+di.cls+'">'+di.t+'</span></p></div>'+

/* ---------- timer fokus ---------- */
var T={mode:'fokus',len:{fokus:1500,istirahat:300},rem:1500,run:false,end:0,iv:null,ctx:null};
function timerHTML(foc){
  return '<section class="panel"><h2>Sesi fokus</h2><p class="sub">25 menit fokus, 5 menit jeda. Satu hal per sesi.</p><div class="timer">'+
    '<div class="tring'+(T.mode==='istirahat'?' rest':'')+'" id="tmr"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="val" id="tmr-ring" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg>'+
    '<div class="in"><p class="num" id="tmr-time">25:00</p><p id="tmr-mode">Fokus</p></div></div>'+
    '<div class="btnrow"><button class="btn" data-act="'+(T.run?'tpause':'tstart')+'" style="--accent:var(--waktu);--on-accent:var(--on-waktu)">'+(T.run?'Jeda':(T.rem<T.len[T.mode]?'Lanjut':'Mulai'))+'</button><button class="btn ghost" data-act="treset">Ulang</button><button class="btn ghost" data-act="tskip">'+(T.mode==='fokus'?'Lewati ke jeda':'Lewati ke fokus')+'</button></div>'+
    '<p class="sub">Hari ini: '+foc.sessions+' sesi · '+foc.minutes+' menit</p></div></section>';
}
function paintTimer(){
  var t=$('#tmr-time');if(!t)return;
  var m=Math.floor(T.rem/60),s=T.rem%60;
  t.textContent=pad(m)+':'+pad(s);
  $('#tmr-mode').textContent=T.mode==='fokus'?'Fokus':'Jeda';
  $('#tmr-ring').setAttribute('stroke-dashoffset',String((326.73*(1-T.rem/T.len[T.mode])).toFixed(2)));
}
function beep(){
  try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;T.ctx=T.ctx||new A();var o=T.ctx.createOscillator(),g=T.ctx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(T.ctx.destination);o.start();o.stop(T.ctx.currentTime+.35)}catch(e){}
}
function tick(){
  var left=Math.max(0,Math.round((T.end-Date.now())/1000));T.rem=left;paintTimer();
  if(left<=0)tDone();
}
function tDone(){
  clearInterval(T.iv);T.run=false;beep();
  if(T.mode==='fokus'){
    var tk=dkey(),f=S.docs.get('f_'+tk)||{date:tk,sessions:0,minutes:0};
    put('f_'+tk,{date:tk,sessions:(f.sessions||0)+1,minutes:(f.minutes||0)+25},true);
    T.mode='istirahat';toast('Sesi fokus selesai. Jeda 5 menit.');
  }else{T.mode='fokus';toast('Jeda selesai. Siap sesi berikutnya?')}
  T.rem=T.len[T.mode];render();
}

function vUang(){

/* ---------- grafik ---------- */
function barChart(days,o){
  var W=560,H=150,L=30,R=6,Tp=10,B=22,n=days.length,bw=(W-L-R)/n,iw=Math.min(26,bw*.6);
  var y=function(v){return Tp+(H-Tp-B)*(1-v/o.max)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="--c:'+o.color+'" role="img" aria-label="'+esc(o.aria)+'">';
  o.ticks.forEach(function(t){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end">'+t+'</text>'});
  if(o.target!=null)s+='<line class="tgt" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.target).toFixed(1)+'" y2="'+y(o.target).toFixed(1)+'"/>';
  days.forEach(function(d,i){
    var x=L+bw*i+(bw-iw)/2,cx=(x+iw/2).toFixed(1);
    if(d.v==null)s+='<rect class="ghost" x="'+x.toFixed(1)+'" y="'+(y(0)-3).toFixed(1)+'" width="'+iw.toFixed(1)+'" height="3" rx="1.5"/>';
    else{var h=Math.max(3,y(0)-y(d.v));s+='<rect class="bar-r" x="'+x.toFixed(1)+'" y="'+(y(0)-h).toFixed(1)+'" width="'+iw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="5"/>'}
    s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle"'+(d.today?' style="fill:var(--fg)"':'')+'>'+d.label+'</text>';
  });
  return s+'</svg>';
}

    if(T.run)return;
    try{var A=window.AudioContext||window.webkitAudioContext;if(A&&!T.ctx)T.ctx=new A()}catch(e){}
    T.end=Date.now()+T.rem*1000;T.run=true;T.iv=setInterval(tick,250);render();
  },
  tpause:function(){clearInterval(T.iv);T.run=false;T.rem=Math.max(0,Math.round((T.end-Date.now())/1000));render()},
  treset:function(){clearInterval(T.iv);T.run=false;T.rem=T.len[T.mode];render()},
  tskip:function(){clearInterval(T.iv);T.run=false;T.mode=T.mode==='fokus'?'istirahat':'fokus';T.rem=T.len[T.mode];render()},
  demo:function(t){loadDemo()},
  undemo:function(){clearDemo()},
  exportjson:function(){exportJSON()},
  exportcsv:function(){exportCSV()},
  importpick:function(){var f=$('#imp-file');if(f){f.value='';f.click()}}
};

  T_('Rangkum bab 4 Algoritma','Algoritma Dasar','',tk,false);

  [[ 'makan',18000,'Nasi dan es teh',0],['transport',12000,'Ojek ke kampus',0],['makan',22000,'Makan malam',-1],['kuliah',25000,'Fotokopi modul',-1],['hiburan',35000,'Nonton bareng',-2],['data',55000,'Paket data',-3],['makan',16000,'Sarapan',-3],['jajan',20000,'Kopi',-4],['transport',10000,'Angkot',-5]].forEach(function(e){
    out.push([id('e_'),{cat:e[0],amount:e[1],note:e[2],date:D(e[3]),ts:ts+i,demo:true}])});
  [[7.5,4,4],[6,3,3],[5.5,2,3],[8,4,5],[7,3,4],[6.5,3,3],[7.5,4,4]].forEach(function(c,k){var d=D(k-7);out.push(['c_'+d,{date:d,sleep:c[0],energy:c[1],focus:c[2],demo:true}])});
  [[-5,3],[-4,2],[-3,4],[-2,1],[-1,3],[0,1]].forEach(function(f){var d=D(f[0]);out.push(['f_'+d,{date:d,sessions:f[1],minutes:f[1]*25,demo:true}])});
  [[1,'08:00','09:40','Pengantar Sistem Informasi','kuliah'],[2,'10:00','11:40','Algoritma Dasar','kuliah'],[3,'13:00','14:40','Praktikum Sistem Operasi','kuliah'],[4,'19:00','21:00','Belajar Linux','belajar'],[5,'08:00','09:40','Matematika Diskrit','kuliah'],[0,'16:00','17:00','Review mingguan','belajar']].forEach(function(j){
    out.push([id('j_'),{day:j[0],start:j[1],end:j[2],title:j[3],kind:j[4],ts:ts+i,demo:true}])});
  if(!S.docs.has('cfg'))out.push(['cfg',{budget:1500000,savePct:20,sleepTarget:7.5,demo:true}]);

function loadDemo(){
  var items=demoDocs();toast('Memuat data contoh…');

}
function clearDemo(){
  var ids=[];S.docs.forEach(function(v,k){if(v&&v.demo)ids.push(k)});
  ids.forEach(function(k){del(k,true)});
  ui.sheet=null;paintSheet();render();toast('Data contoh dihapus.');

/* ---------- cadangan ---------- */
function backupNote(){
  try{var t=localStorage.getItem('ritme.lastBackup');if(t){var d=new Date(Number(t));return 'Cadangan terakhir: '+fmtShort(d)+' '+d.getFullYear()+'.'}}catch(e){}
  return 'Belum ada cadangan dari perangkat ini.';
}
async function saveFile(name,text,mime){
  var blob=new Blob([text],{type:mime});
  try{
    var d=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(d){await d.save({filename:name,data:blob});return true}
  }catch(e){
    if(e&&e.code==='declined')return false;
    if(e&&e.code==='host_unavailable'){toast('Aplikasi ini belum bisa menyimpan file. Buka lewat browser.');return false}
    toast('Belum bisa menyimpan file. Coba lagi sebentar.');return false;
  }
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return true;
  }catch(e){toast('Belum bisa menyimpan file.');return false}
}
async function exportJSON(){
  var docs=[];S.docs.forEach(function(v,k){if(v&&!v.demo)docs.push([k,v])});
  if(!docs.length){toast('Belum ada data untuk dicadangkan.');return}
  var ok=await saveFile('ritme-cadangan-'+dkey()+'.json',JSON.stringify({app:'ritme',v:1,saved:new Date().toISOString(),docs:docs}),'application/json');
  if(ok){try{localStorage.setItem('ritme.lastBackup',String(Date.now()))}catch(e){}toast('Cadangan disimpan.');if(ui.sheet)paintSheet(true)}
}
async function exportCSV(){
  var ex=byPrefix('e_').filter(function(e){return !e.demo}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')});
  if(!ex.length){toast('Belum ada pengeluaran untuk diekspor.');return}
  var q=function(s){s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  var rows=['Tanggal,Kategori,Nominal,Catatan'].concat(ex.map(function(e){return [e.date,q(CAT[e.cat]?CAT[e.cat].n:'Lainnya'),e.amount,q(e.note)].join(',')}));
  var ok=await saveFile('ritme-pengeluaran-'+dkey()+'.csv','﻿'+rows.join('\n'),'text/csv');
  if(ok)toast('Ekspor disimpan.');
}
function importJSON(file){
  var r=new FileReader();
  r.onerror=function(){toast('File tidak bisa dibaca.')};
  r.onload=function(){
    var data;try{data=JSON.parse(String(r.result))}catch(e){toast('File bukan cadangan Ritme yang valid.');return}
    if(!data||data.app!=='ritme'||!Array.isArray(data.docs)){toast('File bukan cadangan Ritme yang valid.');return}
    var okId=/^(?:(?:t|e|c|f|j|r)_[A-Za-z0-9_.:-]{1,60}|cfg)$/,n=0;
    data.docs.forEach(function(x){
      if(!Array.isArray(x)||typeof x[0]!=='string'||!okId.test(x[0])||!x[1]||typeof x[1]!=='object'||Array.isArray(x[1]))return;
      put(x[0],x[1],true);n++;
    });
    ui.sheet=null;paintSheet();render();toast(n+' catatan dipulihkan.');
  };
  r.readAsText(file);
}

/* ---------- event ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  var h=ACT[t.dataset.act];if(h)h(t,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var h=FORM[f.dataset.form];if(h)h(f);
});
document.addEventListener('input',function(e){
  if(e.target.id==='exp-amount'){var d=e.target.value.replace(/\D/g,'');e.target.value=d?new Intl.NumberFormat('id-ID').format(parseInt(d,10)):''}
});
document.addEventListener('change',function(e){
  if(e.target.id==='imp-file'&&e.target.files&&e.target.files[0])importJSON(e.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)ACT.closesheet()});

/* ---------- mulai ---------- */
async function boot(){
  paintNav();paintChip();render();
  var db=null,user=null,uidv=null;
  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=r[0];user=r[1];
      if(user)uidv=await user.id();
    }
  }catch(e){}
  if(db&&uidv){
    S.mode='cloud';S.col=db.collection('data/users/'+uidv);S.sync='connecting';paintChip();
    S.to=setTimeout(function(){if(S.sync!=='synced'){S.sync='slow';S.loaded=true;render()}},10000);
    S.col.onSnapshot(function(snap){
      var m=new Map();snap.docs.forEach(function(d){if(d.exists)m.set(d.id,d.data())});
      S.docs=m;
      if(!snap.metadata.fromCache){S.sync='synced';S.loaded=true;clearTimeout(S.to)}
      else if(snap.size>0)S.loaded=true;
      render();
    },function(){S.sync='error';S.loaded=true;render()});
  }else{
    S.mode='local';S.sync='local';
    try{var raw=localStorage.getItem('ritme.docs');if(raw)S.docs=new Map(JSON.parse(raw))}catch(e){}
    S.loaded=true;render();
  }
}
boot();
})();
